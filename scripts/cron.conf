# ============================================================================
# Caffenet — Cron Configuration for Shared Hosting
# ============================================================================
# Add these lines to your cPanel/DirectAdmin cron tab.
# They run the worker CLI every minute (limit of shared hosting).
#
# Replace /home/USER/ with your actual home directory.
# Replace /usr/bin/node with the path to Node.js on your server.
#   (find it with: which node)
# ============================================================================

# Worker — processes queued jobs (notifications, push, email, SMS, cleanup)
# Self-terminates after 50 jobs OR 55 seconds (whichever comes first)
* * * * * cd /home/USER/caffenet/api && /usr/bin/node dist/worker.js --max-jobs=50 --timeout=55 >> storage/logs/cron-worker.log 2>&1

# Cleanup expired OTPs (every 5 min)
*/5 * * * * cd /home/USER/caffenet/api && /usr/bin/node dist/worker.js --queue caffenet-cleanup --once >> storage/logs/cron-cleanup.log 2>&1

# Database backup (daily at 3 AM)
0 3 * * * /usr/bin/mysqldump --single-transaction -u DB_USER -p'DB_PASS' DB_NAME | gzip > /home/USER/backups/caffenet-$(date +\%Y\%m\%d).sql.gz

# Delete backups older than 30 days (weekly)
0 4 * * 0 find /home/USER/backups/ -type f -name 'caffenet-*.sql.gz' -mtime +30 -delete

# ============================================================================
# Notes:
# 1. Worker requires the same .env file as the API.
# 2. Make sure storage/logs/ is writable: chmod -R 755 storage/logs/
# 3. If cron jobs don't fire, check that the cron service is enabled in your cPanel.
# 4. If you experience memory issues, reduce --max-jobs to 30 or 20.
# 5. Logs accumulate — implement log rotation or periodic cleanup:
#    0 5 * * 0 find /home/USER/caffenet/api/storage/logs/ -name '*.log' -mtime +30 -delete
# ============================================================================
