# ============================================================================
# Caffenet — Docker Compose for Development (VPS profile)
# ============================================================================
# Usage: docker compose -f docker/docker-compose.yml up -d
# This is for VPS development only. Shared hosting doesn't use Docker.
# ============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: caffenet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: caffenet
      MYSQL_USER: caffenet
      MYSQL_PASSWORD: caffenetpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis is OPTIONAL — only used when CACHE_DRIVER=redis or QUEUE_DRIVER=redis (VPS profile)
  redis:
    image: redis:7-alpine
    container_name: caffenet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO (S3-compatible) is OPTIONAL — only used when STORAGE_DRIVER=s3 (VPS profile)
  minio:
    image: minio/minio:latest
    container_name: caffenet-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data

  # Mailhog for development email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: caffenet-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  mysql_data:
  redis_data:
  minio_data:
